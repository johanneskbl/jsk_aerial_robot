servo_controller:
  # # comment this part to use the default topics
  #  state_sub_topic: kondo_servo/states_real
  #  ctrl_pub_topic: kondo_servo/states_cmd
  #  torque_pub_topic: kondo_servo/activate_cmd

  gimbals:
    angle_sgn: 1
    angle_scale: 0.001533981  # 2 * pi / 4096  Dynamixel servo: XC330-T181
    velocity_scale: 0.02398082 # 0.229 [rev/min] -> rad/s, 0.104719755  # 2 * pi / 60
    torque_scale: 0.00064  # 1 [mA] -> Nm·A, 0.64/1000 Dynamixel servo: XC330-T181
    zero_point_offset: 2048

    # Gazebo: Effort PID on the gimbal joint with inertia J ~ 1.1e-3 kg m^2 (incl. the virtual thrust link) and joint damping
    # c = 0.8 Nms/rad (urdf). Step response J*a'' + (c + d)*a' + p*(a - a_cmd) = 0 has the time constant (c + d) / p,
    # so p = 60 matches t_servo = 15 ms (poles at 13.7 ms and 1.3 ms). Previously p = 5, i.e., 180 ms.
    controller1:
      id: 0
      name: gimbal1
      simulation:
        pid: {p: 60.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
        init_value: 0
        type: effort_controllers/JointPositionController

    controller2:
      id: 1
      name: gimbal2
      simulation:
        pid: {p: 60.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
        init_value: 0
        type: effort_controllers/JointPositionController

    controller3:
      id: 2
      name: gimbal3
      simulation:
        pid: {p: 60.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
        init_value: 0
        type: effort_controllers/JointPositionController

    controller4:
      id: 3
      name: gimbal4
      simulation:
        pid: {p: 60.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
        init_value: 0
        type: effort_controllers/JointPositionController
