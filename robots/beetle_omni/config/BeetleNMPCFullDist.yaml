mpc_solver_name: aerial_robot_control::mpc_solver::TiltQdServoDistMdlMPCSolver
aerial_robot_control_name: aerial_robot_control/nmpc_controller/tilt_mt/servo_dist_nmpc

controller:
  alloc:
    type: 1  # 0: pseudo allocation, 1: heuristic allocation,
    ft_thresh: 1.0  # N

  nmpc:
    T_samp: 0.01  # 100 Hz  TODO: should be adjusted by main_rate
    T_horizon: 2.0  # in seconds
    T_step: 0.1  # in seconds

    # Non-uniform grid: N_steps_short short shooting intervals of T_step_short and one interval with the rest of T_step
    # replace the first interval of T_step (e.g. for N_steps_short = 5: 5 x 10 ms + 50 ms + 19 x 100 ms).
    # N_steps_short = 0: uniform grid
    # Needs rebuild after changing it! Read by the Python generation, the C++ controller takes the grid from the solver
    N_steps_short: 10  # <= T_step / T_step_short = 10
    T_step_short: 0.01  # seconds

    # Frame tracked by the MPC cost
    # Need rebuild after changing it! Read by both the Python generation and the C++ controller
    tracking_frame: ee_tracking  # 'cog_tracking' or 'ee_tracking'

    # Hard constraints
    w_min: -6
    w_max: 6  # 1 rad/s ~ 57 deg/s

    v_min: -1
    v_max: 1

    thrust_min: 0  # N
    thrust_max: 23  # N

    a_min: -3.15
    a_max: 3.15  # 180 deg + a little bit

    # Cost function weights
    Qp_xy: 300
    Qp_z: 400
    Qv_xy: 10
    Qv_z: 10
    Qq_xy: 300
    Qq_z: 600
    Qw_xy: 5
    Qw_z: 5
    Qa: 2
    Rt: 2
    Rac_d: 250  # difference of ac

    # Slack constraint weights
    linear_slack_weight: 10
    quadratic_slack_weight: 100

    is_attitude_ctrl: false
    is_body_rate_ctrl: false

    is_print_phys_params: false
    is_debug: false
