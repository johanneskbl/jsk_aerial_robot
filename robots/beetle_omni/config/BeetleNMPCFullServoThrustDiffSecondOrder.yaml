mpc_solver_name: aerial_robot_control::mpc_solver::TiltQdServoThrustDiffSecondOrderMdlMPCSolver
aerial_robot_control_name: aerial_robot_control/differential_mpc_controller/tilt_mt/servo_thrust_diff_second_order_mpc

controller:
  alloc:
    type: 0  # 0: pseudo allocation, 1: heuristic allocation,
    ft_thresh: 1.0  # N

  nmpc:
    T_samp: 0.01  # 100 Hz  TODO: should be adjusted by main_rate
    T_horizon: 2.0  # seconds
    T_step: 0.1  # seconds

    # Non-uniform grid: N_steps_short short shooting intervals of T_step_short and one interval with the rest of T_step
    # replace the first interval of T_step (here 5 x 10 ms + 50 ms + 19 x 100 ms).
    # N_steps_short = 0: uniform grid
    # Needs rebuild after changing it! Read by the Python generation, the C++ controller takes the grid from the solver
    N_steps_short: 0 # 5  # <= T_step / T_step_short = 10
    T_step_short: 0.01  # seconds

    # Frame tracked by the MPC cost
    # Needs rebuild after changing it! Read by both the Python generation and the C++ controller
    tracking_frame: ee_tracking  # 'cog_tracking' or 'ee_tracking'

    # Hard constraints
    w_min: -6
    w_max: 6  # 1 rad/s ~ 57 deg/s

    v_min: -1
    v_max: 1

    thrust_min: 0  # N
    thrust_max: 23  # N

    # From Claude: In AM32 firmware the output_limit=50000 clamps the throttle to 5 units per ms,
    # With props, full throttle is ~13.9 kRPM so the rate caps at 33 kRPM/s
    # Analyzing bench test data, the maximum positive rate caps at +/- 60 kRPM/s but this is for sharp throttle changes
    # In thrust, the mapping depends on the RPM rate as well as on the RPM itself.
    # The limit is also skewed at about +80 N/s and -120 N/s. Although, the instantaneous thrust rate is lower since the
    # airflow is inert. Therefore, a good limit is about +65 N/s and -90 N/s.
    # From Claude: Due to setting in urdf: 100 N/s
    # From Eugenio: 200 N/s
    thrust_vel_min: -90  # N/s
    thrust_vel_max: 65  # N/s

    a_min: -3.15
    a_max: 3.15  # 180 deg + a little bit

    a_vel_min: -11 # 11 / 3 (from Claude due to real / urdf); 8 (from Eugenio)  # rad/s
    a_vel_max: 11  # rad/s

    Qp_xy: 300
    Qp_z: 400
    Qv_xy: 10
    Qv_z: 10
    Qq_xy: 600
    Qq_z: 1000
    Qw_xy: 5
    Qw_z: 5
    Qa: 10.0  # NEEDS TO BE ZERO FOR NULLSPACE CONTROL!
    Qad: 1
    Qt: 1.0  # NEEDS TO BE ZERO FOR NULLSPACE CONTROL!
    Qtd: 0.001
    Qfu: 0.01 # Generated body force
    Qtau: 0.001 # Generated body torque

    Rtd_c: 0.001
    Rad_c: 0.1

    # Nullspace control:
    # rate [1/s] at which the actuators are pulled toward their rest values (servo angle 0,
    # thrust 0) within the nullspace of the Jacobian
    nullspace_servo_gain: 0.0 # 3.0  # [1/s]
    nullspace_thrust_gain: 0.0 # 1.0  # [1/s]

    # Slack constraint weights
    linear_slack_weight: 10
    quadratic_slack_weight: 100

    is_attitude_ctrl: false
    is_body_rate_ctrl: false

    is_print_phys_params: false
    is_debug: false
