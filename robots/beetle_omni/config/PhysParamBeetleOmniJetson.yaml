physical:  # with original ball and battery
  # mass: 3.146  # kg
  mass: 3.300  # WITH CABLE
  gravity: 9.798  #9.80665 # m/s^2   Tokyo 9.798; in sim: 9.80665
  inertia_diag: [0.0627958, 0.0620796, 0.0948795]  # kg m^2
  dr1: 1  # direction of motor 1
  p1: [0.194824, 0.194652, -0.00368224]  # position of motor 1
  dr2: -1  # direction of motor 2
  p2: [-0.194837, 0.194652, -0.00368224]  # position of motor 2
  dr3: 1  # direction of motor 3
  p3: [-0.194837, -0.195008, -0.00368224]  # position of motor 3
  dr4: -1  # direction of motor 4
  p4: [0.194824, -0.195008, -0.00368224]  # position of motor 4
  kq_d_kt: 0.0165

  num_rotors: 4
  t_rotor: 0.015  # RPM-mode ESC (AM32 P65 I0 D3000), identified from bench and flight data. The previous value was 0.0942
  # Rate model of the thrust rate estimation: t_thrust_rate * d2F/dt2 + dF/dt = gain_thrust_rate * dF_cmd/dt(t - d_in)
  gain_thrust_rate: 0.73
  t_thrust_rate: 0.022

  num_servos: 4
  # Dynamixel servo XC330-T181 with self-tuned PID
  # Identified first order model: time constant 6~10 ms after a dead time:
  #   t_servo + dead time = 31 ms (see delay_servo_cmd in Servo.yaml).
  # Previous: 0.0480 (kondo's 0.085883)
  t_servo: 0.015 # (optimal: 0.008 with total cmd delay of 0.031)
  # Velocity predictor: t_servo_rate * d2a/dt2 + da/dt = gain_servo_rate * da_cmd/dt(t - d_in)
  t_servo_rate: 0.021
  gain_servo_rate: 1.0

  ball_effector_p: [0, 0, 0.264]  # m
  ball_effector_q: [1, 0, 0, 0]  # quaternion, qw, qx, qy, qz
