mpc_solver_name: aerial_robot_control::mpc_solver::TiltQdServoThrustDistMdlMPCSolver
aerial_robot_control_name: aerial_robot_control/nmpc_controller/tilt_mt/servo_thrust_dist_nmpc

controller:
  alloc:
    type: 1  # 0: pseudo allocation, 1: heuristic allocation,
    ft_thresh: 1.0  # N

  nmpc:
    T_samp: 0.01  # 100 Hz  TODO: should be adjusted by main_rate
    T_horizon: 2.0  # seconds
    T_step: 0.1  # seconds

    # Frame tracked by the MPC cost
    # Need rebuild after changing it! Read by both the Python generation and the C++ controller
    tracking_frame: ee_tracking  # 'cog_tracking' or 'ee_tracking'

    # Hard constraints
    w_min: -6
    w_max: 6  # 1 rad/s ~ 57 deg/s

    v_min: -1
    v_max: 1

    thrust_min: 0  # N
    thrust_max: 23  # N

    a_min: -3.15
    a_max: 3.15  # 180 deg + a little bit

    # Cost function weights
    Qp_xy: 300
    Qp_z: 400
    Qv_xy: 10
    Qv_z: 10
    Qq_xy: 300
    Qq_z: 600
    Qw_xy: 5
    Qw_z: 5
    Qa: 1
    Qt: 1  # t is for thrust

    Rtc_d: 1  # difference of ftc
    Rac_d: 250  # difference of ac

    # Slack constraint weights
    linear_slack_weight: 10
    quadratic_slack_weight: 100

    is_attitude_ctrl: false
    is_body_rate_ctrl: false

    is_print_phys_params: false
    is_debug: false
