#!/usr/bin/env python
PACKAGE = "aerial_robot_control"

from dynamic_reconfigure.parameter_generator_catkin import *
from aerial_robot_msgs.msg import DynamicReconfigureLevels

gen = ParameterGenerator()

gen.add("i_gain_flag", bool_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_FLAG, "I Gain Flag", False)
# Gains of the I-term on the velocity residual: time constant = mass (or inertia) / (gain * control period)
gen.add("i_gain_x", double_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_X, "I Gain x [N/m]", 62.9, 0.0, 1000.0)
gen.add("i_gain_y", double_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_Y, "I Gain y [N/m]", 62.9, 0.0, 1000.0)
gen.add("i_gain_z", double_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_Z, "I Gain z [N/m]", 104.9, 0.0, 1000.0)
gen.add("i_gain_roll", double_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_ROLL, "I Gain roll [Nm/rad]", 1.25, 0.0, 50.0)
gen.add("i_gain_pitch", double_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_PITCH, "I Gain pitch [Nm/rad]", 1.25, 0.0, 50.0)
gen.add("i_gain_yaw", double_t, DynamicReconfigureLevels.RECONFIGURE_I_GAIN_YAW, "I Gain yaw [Nm/rad]", 3.2, 0.0, 50.0)

exit(gen.generate(PACKAGE, "aerial_robot_control", "ITerm"))
